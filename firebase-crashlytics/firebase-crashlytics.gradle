import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'firebase-library'
    id("kotlin-android")
    id 'LicenseResolverPlugin'
}

firebaseLibrary {
    libraryGroup = "crashlytics"
    testLab {
        enabled = true
        device 'model=panther,version=33'
    }
    releaseNotes {
        name.set("{{crashlytics}}")
        versionName.set("crashlytics")
    }
}

android {
    installation {
        timeOutInMs 60 * 1000
    }
    namespace "com.google.firebase.crashlytics"
    compileSdkVersion 37
    testOptions {
        targetSdk project.targetSdkVersion
        unitTests.includeAndroidResources = true
    }
    defaultConfig {
        minSdkVersion project.minSdkVersion
        versionName version

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        androidTest {
            java {
                srcDir 'src/testUtil'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_1_8 } }

thirdPartyLicenses {
    add 'Apache-2.0', "${rootDir}/third_party/licenses/apache-2.0.txt"
    add 'Tape', "${rootDir}/third_party/licenses/tape.txt"
}

dependencies {
    javadocClasspath(libs.findbugs.jsr305)

    api(project(":firebase-sessions"))
    api(libs.playservices.tasks)
    api(libs.firebase.annotations)
    api(libs.firebase.common)
    api(libs.firebase.components)
    // TODO(m187-repin): restore pin on com.google.firebase:firebase-config-interop.
    api(project(":firebase-config-interop"))
    // TODO(m187-repin): restore pin on com.google.firebase:firebase-encoders.
    api(project(":encoders:firebase-encoders"))
    // TODO(m187-repin): restore pin on com.google.firebase:firebase-encoders-json.
    api(project(":encoders:firebase-encoders-json"))
    // TODO(m187-repin): restore pin on com.google.firebase:firebase-installations.
    api(project(":firebase-installations")) {
        exclude group: 'com.google.firebase', module: 'firebase-common-ktx'
    }
    // TODO(m187-repin): restore pin on com.google.firebase:firebase-installations-interop.
    api(project(":firebase-installations-interop"))
    api("com.google.firebase:firebase-measurement-connector:20.0.1")

    // TODO(m187-repin): restore pin on com.google.android.datatransport:transport-api.
    implementation(project(":transport:transport-api"))
    // TODO(m187-repin): restore pin on com.google.android.datatransport:transport-backend-cct.
    implementation(project(":transport:transport-backend-cct"))
    // TODO(m187-repin): restore pin on com.google.android.datatransport:transport-runtime.
    implementation(project(":transport:transport-runtime"))
    implementation(libs.androidx.annotation)
    compileOnly(libs.errorprone.annotations)

    compileOnly(libs.autovalue.annotations)

    annotationProcessor(project(":encoders:firebase-encoders-processor"))
    annotationProcessor(libs.autovalue)

    testImplementation(libs.androidx.test.core)
    testImplementation(libs.androidx.test.runner)
    testImplementation(libs.junit)
    testImplementation(libs.mockito.core)
    testImplementation("org.robolectric:robolectric:4.16.1")
    testImplementation(libs.truth)
    testImplementation(project(":integ-testing"))

    androidTestImplementation(libs.androidx.test.core)
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.androidx.test.junit)
    // TODO(m187-repin): restore pin on com.google.firebase:firebase-encoders-json.
    androidTestImplementation(project(":encoders:firebase-encoders-json"))
    androidTestImplementation(libs.protobuf.java)
    androidTestImplementation(libs.truth)
    androidTestImplementation(libs.dexmaker)
    androidTestImplementation(libs.mockito.dexmaker)
    androidTestImplementation(libs.mockito.core)
    androidTestImplementation(libs.androidx.test.junit)
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.truth)
    androidTestImplementation(libs.playservices.tasks)
    androidTestImplementation(project(":integ-testing"))
}
