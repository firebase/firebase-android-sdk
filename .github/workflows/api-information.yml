name: API Information

on: [ pull_request ]

jobs:
  api-information-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 2
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2.5.2
        with:
          java-version: 11
          distribution: temurin
          cache: gradle
      - name: Set up Python 3.10
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.10'
      - name: Set up fireci
        run: pip3 install -e ci/fireci
      - name: Run api-information check
        run: |
          fireci api_information \
            --issue_number=${{ github.event.pull_request.number }} \
            --repo_name=${{ github.repository }} \
            --auth_token=${{ secrets.GOOGLE_OSS_BOT_TOKEN }}
