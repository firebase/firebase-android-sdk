name: Make BoM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.10'
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Set up JDK 11
        uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2.5.2
        with:
          java-version: 11
          distribution: temurin
          cache: gradle

      - name: Build
        run: |
          ./ci/run.sh \
          --artifact-target-dir=./logs/artifacts \
          --artifact-patterns=bom.zip \
          --artifact-patterns=bomReleaseNotes.md \
          --artifact-patterns=recipeVersionUpdate.txt \
          gradle \
          -- \
          --build-cache \
          buildBomZip

      - name: Upload generated artifacts
        uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2.3.1
        with:
          name: artifacts
          path: ./logs/artifacts/
          retention-days: 5
