name: Firebase SQL CI Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  determine_changed:
    name: "Determine changed modules"
    runs-on: ubuntu-latest
    if: (github.repository == 'Firebase/firebase-android-sdk' && github.event_name == 'push') || github.event_name == 'pull_request'
    outputs:
      modules: ${{ steps.changed-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      # Do not update to version 6, context: https://blog.gradle.org/github-actions-for-gradle-v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - id: changed-modules
        run: |
          git diff --name-only HEAD~1 | xargs printf -- '--changed-git-paths %s\n' | xargs ./gradlew writeChangedProjects --output-file-path=modules.json
          echo modules=$(cat modules.json) >> $GITHUB_OUTPUT

  e2e_tests:
    name: "End-to-End Tests"
    # Only runs after a merge to main, or on pull requests that do not come from forks, because
    # forks cannot read the secrets.
    if: ((github.repository == 'Firebase/firebase-android-sdk' && github.event_name == 'push') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(fromJSON(needs.determine_changed.outputs.modules), ':firebase-sql')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - determine_changed

    steps:
      # The service is not part of the repository. Fails before the emulator starts when it is not
      # set.
      - name: Check the Firebase SQL service secrets
        env:
          FIREBASE_SQL_SERVICE_ID: ${{ secrets.FIREBASE_SQL_SERVICE_ID }}
          FIREBASE_SQL_LOCATION: ${{ secrets.FIREBASE_SQL_LOCATION }}
        run: |
          if [ -z "$FIREBASE_SQL_SERVICE_ID" ] || [ -z "$FIREBASE_SQL_LOCATION" ]; then
            echo "::error::Set the FIREBASE_SQL_SERVICE_ID and FIREBASE_SQL_LOCATION repository secrets to the Firebase SQL service of the integration test project."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: true
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      # Do not update to version 6, context: https://blog.gradle.org/github-actions-for-gradle-v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Add google-services.json
        env:
          INTEG_TESTS_GOOGLE_SERVICES: ${{ secrets.INTEG_TESTS_GOOGLE_SERVICES }}
        run: |
          echo $INTEG_TESTS_GOOGLE_SERVICES | base64 -d > google-services.json

      - name: firebase-sql End-to-End Tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a #v2.37.0
        env:
          FIREBASE_SQL_SERVICE_ID: ${{ secrets.FIREBASE_SQL_SERVICE_ID }}
          FIREBASE_SQL_LOCATION: ${{ secrets.FIREBASE_SQL_LOCATION }}
        with:
          api-level: 31
          arch: x86_64
          ram-size: 4096M
          heap-size: 4096M
          script: |
            adb logcat -v time > logcat.txt &
            ./gradlew :firebase-sql:connectedCheck -PtargetServiceId="$FIREBASE_SQL_SERVICE_ID" -PtargetLocation="$FIREBASE_SQL_LOCATION"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-sql-e2e-logs
          path: |
            logcat.txt
            firebase-sql/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: ignore
